# Seccomp profile installer for Pyxis/enroot.
#
# Pyxis (the Slurm SPANK plugin that gives you `--container-image`) calls into
# enroot, which expects a seccomp profile file at
# /var/lib/kubelet/seccomp/profiles/enroot on every node. Managed Kubernetes
# distributions (EKS, GKE) don't ship that file -- without this DaemonSet
# the pyxis-enabled compute pods get stuck in Init:CreateContainerError with:
#   cannot load seccomp profile /var/lib/kubelet/seccomp/profiles/enroot:
#     open ...: no such file or directory
#
# Apply this BEFORE `helm install slurm` when compute.pyxis.enabled: true.
# The DaemonSet runs exactly one init container per node that copies the
# profile file from a ConfigMap onto the node's hostPath, then the "pause"
# container stays alive so the kubelet doesn't restart and re-copy on every
# reconcile. It is idempotent: re-applying overwrites in place.
#
# The profile JSON below is the standard enroot seccomp filter. If enroot
# upstream updates it, mirror the new version in the ConfigMap. To verify a
# node picked it up, run:
#   kubectl debug node/<NODE> -it --image=busybox -- \
#     cat /host/var/lib/kubelet/seccomp/profiles/enroot | head -5
---
apiVersion: v1
kind: Namespace
metadata:
  name: seccomp-installer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: enroot-seccomp-profile
  namespace: seccomp-installer
data:
  enroot: |
    {
      "defaultAction": "SCMP_ACT_ALLOW",
      "syscalls": [
        {
          "names": ["keyctl"],
          "action": "SCMP_ACT_ERRNO",
          "errnoRet": 38,
          "comment": "enroot uses session keyrings; deny to force fallback"
        }
      ]
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seccomp-installer
  namespace: seccomp-installer
  labels:
    app.kubernetes.io/name: seccomp-installer
    app.kubernetes.io/part-of: sunk-anywhere
spec:
  selector:
    matchLabels:
      app: seccomp-installer
  template:
    metadata:
      labels:
        app: seccomp-installer
    spec:
      # Tolerate every taint we know about so the installer reaches GPU and
      # Slurm-lock nodes. Add cloud-specific taints here as needed.
      tolerations:
        - operator: Exists
      hostPID: false
      hostNetwork: false
      initContainers:
        - name: install-profile
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /host-seccomp/profiles
              cp /profile/enroot /host-seccomp/profiles/enroot
              chmod 0644 /host-seccomp/profiles/enroot
              echo "installed $(wc -c < /host-seccomp/profiles/enroot) bytes at /var/lib/kubelet/seccomp/profiles/enroot on $(hostname)"
          volumeMounts:
            - name: host-seccomp
              mountPath: /host-seccomp
            - name: profile-source
              mountPath: /profile
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: host-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
        - name: profile-source
          configMap:
            name: enroot-seccomp-profile
