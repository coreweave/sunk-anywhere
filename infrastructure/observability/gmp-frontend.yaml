# GMP Frontend - provides Prometheus-compatible query API for in-cluster use
# This allows Grafana to query GMP metrics via standard PromQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmp-frontend
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gmp-frontend
  template:
    metadata:
      labels:
        app: gmp-frontend
    spec:
      automountServiceAccountToken: true
      tolerations:
        - key: "sunk.coreweave.com/lock"
          operator: "Exists"
          effect: "NoExecute"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-nodepool
                    operator: In
                    values:
                      - cpu-4
      containers:
        - name: frontend
          image: us-central1-artifactregistry.gcr.io/gke-release/gke-release/prometheus-engine/frontend:v0.18.0-gke.2
          args:
            - "--web.listen-address=:9090"
            - "--query.project-id=YOUR_PROJECT_ID"
          ports:
            - name: web
              containerPort: 9090
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gmp-frontend
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  selector:
    app: gmp-frontend
